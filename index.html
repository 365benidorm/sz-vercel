<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sbírka zajímavostí</title>
<meta name="description" content="Vlož odkaz na video — appka ho přepíše a shrne do bodů." />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="theme-color" content="#29594F" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF7EE;
    --card:#FFFEFA;
    --ink:#2A2521;
    --ink-soft:#6b6152;
    --teal:#29594F;
    --teal-dark:#1c3e37;
    --brass:#9C7A34;
    --brick:#A8452C;
    --line: rgba(42,37,33,0.12);
    --shadow: 0 4px 14px rgba(42,37,33,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Karla',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:24px;
  }
  h1,.display{ font-family:'Fraunces',serif; font-weight:700; letter-spacing:-0.01em; }
  button{ font-family:inherit; cursor:pointer; }
  input{ font-family:inherit; }

  .shell{ max-width:560px; margin:0 auto; padding:20px 18px 8px; }

  header{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px; }
  header h1{ font-size:1.35rem; margin:0; color:var(--teal-dark); }

  .tabs{ display:flex; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:4px; margin-bottom:18px; }
  .tabs button{
    flex:1; border:none; background:transparent; padding:10px 8px; border-radius:9px;
    font-weight:600; font-size:0.92rem; color:var(--ink-soft);
  }
  .tabs button.active{ background:var(--teal); color:#fff; }

  .view{ display:none; }
  .view.active{ display:block; }

  .add-box{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; box-shadow:var(--shadow); }
  .add-box p.hint{ margin:0 0 14px; color:var(--ink-soft); font-size:0.92rem; line-height:1.5; }
  #url-input{
    width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:10px;
    font-size:1rem; background:var(--paper); color:var(--ink); margin-bottom:10px;
  }
  #url-input:focus{ outline:2px solid var(--teal); outline-offset:1px; }
  #add-btn{
    width:100%; padding:13px; border:none; border-radius:10px; background:var(--teal); color:#fff;
    font-weight:700; font-size:1rem;
  }
  #add-btn:active{ background:var(--teal-dark); }
  #add-status{ margin-top:14px; font-size:0.92rem; color:var(--ink-soft); min-height:1.2em; }

  .search-row{ margin-bottom:14px; }
  #search{
    width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:10px;
    background:var(--card); font-size:0.95rem; color:var(--ink);
  }

  .empty{ color:var(--ink-soft); text-align:center; padding:40px 10px; font-size:0.95rem; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow); }
  .card.status-pending{ border-left:4px solid var(--brass); }
  .card.status-error{ border-left:4px solid var(--brick); }
  .card.status-done{ border-left:4px solid var(--teal); }
  .card-head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:4px; }
  .card-title{ font-family:'Fraunces',serif; font-weight:700; font-size:1.05rem; }
  .card-date{ font-size:0.78rem; color:var(--ink-soft); white-space:nowrap; }
  .card-url{ display:block; font-size:0.78rem; color:var(--ink-soft); text-decoration:none; margin-bottom:8px; word-break:break-all; }
  .card-body ol{ margin:8px 0 4px; padding-left:20px; }
  .card-body li{ margin-bottom:5px; line-height:1.45; }
  .card-body .muted{ color:var(--ink-soft); font-size:0.9rem; margin:6px 0; }
  .card-actions{ display:flex; gap:8px; margin-top:10px; }
  .card-actions button{
    border:1px solid var(--line); background:transparent; color:var(--ink-soft);
    padding:7px 12px; border-radius:8px; font-size:0.82rem;
  }
  .card-actions .retry{ color:var(--teal-dark); border-color:var(--teal); }
  .card-actions .del{ color:var(--brick); border-color:var(--brick); }
</style>
</head>
<body>
<div class="shell">
  <header><h1 class="display">Sbírka zajímavostí</h1></header>

  <div class="tabs">
    <button id="tab-add">📥 Přidat</button>
    <button id="tab-list">🗂️ Sbírka</button>
  </div>

  <div id="view-add" class="view">
    <div class="add-box">
      <p class="hint">Vlož odkaz na video (Instagram, Facebook, TikTok…), nebo ho na telefonu rovnou sdílej sem přes nabídku Sdílet.</p>
      <input id="url-input" type="url" inputmode="url" placeholder="https://www.instagram.com/reel/..." />
      <button id="add-btn">Zpracovat</button>
      <div id="add-status"></div>
    </div>
  </div>

  <div id="view-list" class="view">
    <div class="search-row">
      <input id="search" type="search" placeholder="Hledat…" />
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
  // ── Uprav před nahráním na GitHub Pages ──
  const BACKEND_URL = "https://video-backend-six-mocha.vercel.app/"; // adresa tvého backendu na Vercelu
  const APP_SECRET = "sbirkazajimavosti"; // stejné heslo, jaké máš na Vercelu v proměnné APP_SECRET

  const STORAGE_KEY = "sz_items_v1";

  function loadItems(){ try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; } }
  function saveItems(list){ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function extractUrl(text){
    if (!text) return "";
    const m = text.match(/https?:\/\/\S+/);
    return m ? m[0] : text.trim();
  }
  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  let items = loadItems();

  const tabAdd = document.getElementById('tab-add');
  const tabList = document.getElementById('tab-list');
  const viewAdd = document.getElementById('view-add');
  const viewList = document.getElementById('view-list');
  const input = document.getElementById('url-input');
  const addBtn = document.getElementById('add-btn');
  const statusEl = document.getElementById('add-status');
  const listEl = document.getElementById('list');
  const searchEl = document.getElementById('search');

  function showView(name){
    viewAdd.classList.toggle('active', name==='add');
    viewList.classList.toggle('active', name==='list');
    tabAdd.classList.toggle('active', name==='add');
    tabList.classList.toggle('active', name==='list');
    if (name === 'list') renderList();
  }
  tabAdd.onclick = () => showView('add');
  tabList.onclick = () => showView('list');

  async function processUrl(rawUrl){
    const url = extractUrl(rawUrl);
    if (!url) return;
    const item = { id: uid(), url, title: 'Zpracovávám…', points: [], status: 'pending', createdAt: Date.now() };
    items.unshift(item);
    saveItems(items);
    input.value = '';
    statusEl.textContent = 'Stahuju a přepisuju video… u delších videí to může chvíli trvat.';

    if (!BACKEND_URL.includes('TVUJ-PROJEKT')) {
      try {
        const res = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-App-Secret': APP_SECRET },
          body: JSON.stringify({ url })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || ('Server odpověděl chybou ' + res.status));
        item.title = data.title || 'Bez názvu';
        item.points = data.points || [];
        item.transcript = data.transcript || '';
        item.status = 'done';
        statusEl.textContent = 'Hotovo — najdeš to ve Sbírce.';
      } catch (e) {
        item.status = 'error';
        item.error = e.message;
        item.title = 'Nepodařilo se zpracovat';
        statusEl.textContent = 'Chyba: ' + e.message;
      }
    } else {
      item.status = 'error';
      item.error = 'Backend ještě není nastavený (uprav BACKEND_URL v index.html).';
      item.title = 'Backend nenastaven';
      statusEl.textContent = item.error;
    }
    saveItems(items);
    if (viewList.classList.contains('active')) renderList();
  }

  addBtn.onclick = () => { if (input.value.trim()) processUrl(input.value); };
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') addBtn.click(); });

  function renderList(){
    const q = (searchEl.value || '').toLowerCase();
    const filtered = items.filter(it => !q || (it.title||'').toLowerCase().includes(q) || it.url.toLowerCase().includes(q));
    listEl.innerHTML = '';
    if (!filtered.length){
      listEl.innerHTML = '<p class="empty">Zatím tu nic není. Vlož odkaz v záložce Přidat.</p>';
      return;
    }
    filtered.forEach(it => {
      const card = document.createElement('div');
      card.className = 'card status-' + it.status;
      const date = new Date(it.createdAt).toLocaleDateString('cs-CZ');
      let bodyHtml = '';
      if (it.status === 'done'){
        bodyHtml = '<ol>' + it.points.map(p => `<li>${escapeHtml(p)}</li>`).join('') + '</ol>';
      } else if (it.status === 'pending'){
        bodyHtml = '<p class="muted">Zpracovává se…</p>';
      } else {
        bodyHtml = `<p class="muted">Chyba: ${escapeHtml(it.error||'')}</p>`;
      }
      card.innerHTML = `
        <div class="card-head">
          <span class="card-title">${escapeHtml(it.title)}</span>
          <span class="card-date">${date}</span>
        </div>
        <a class="card-url" href="${it.url}" target="_blank" rel="noopener">${escapeHtml(it.url)}</a>
        <div class="card-body">${bodyHtml}</div>
        <div class="card-actions">
          ${it.status === 'error' ? '<button class="retry">Zkusit znovu</button>' : ''}
          <button class="del">Smazat</button>
        </div>`;
      card.querySelector('.del').onclick = () => {
        items = items.filter(x => x.id !== it.id);
        saveItems(items);
        renderList();
      };
      const retryBtn = card.querySelector('.retry');
      if (retryBtn) retryBtn.onclick = () => {
        const url = it.url;
        items = items.filter(x => x.id !== it.id);
        saveItems(items);
        showView('add');
        processUrl(url);
      };
      listEl.appendChild(card);
    });
  }
  searchEl.addEventListener('input', renderList);

  // Share target: Android předá sdílený odkaz jako ?url=... nebo ?text=...
  let cameFromShare = false;
  (function handleShare(){
    const params = new URLSearchParams(location.search);
    const shared = params.get('url') || params.get('text') || params.get('title');
    if (shared){
      cameFromShare = true;
      history.replaceState(null, '', location.pathname);
      processUrl(shared);
    }
  })();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

  showView(cameFromShare ? 'add' : (items.length ? 'list' : 'add'));
</script>
</body>
</html>
